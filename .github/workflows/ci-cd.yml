name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./medical

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './medical/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint

      - name: Run Build Check
        run: npm run build

  backend-ci:
    name: Backend CI (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg libsm6 libxext6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Check Python Syntax (Flake8 lint)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Info
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Create Env File for Vite Build
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > medical/.env.production

      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    name: Deploy Backend to Render
    needs: [backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Sync Env Vars and Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PYTHON_VERSION: "3.13.1"
          APP_NAME: ${{ secrets.APP_NAME }}
          DEBUG: ${{ secrets.DEBUG }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
        run: |
          # Clean up any trailing/leading whitespaces, newlines, or carriage returns from secrets
          CLEAN_RENDER_SERVICE_ID=$(echo "$RENDER_SERVICE_ID" | tr -d '\r\n[:space:]')
          CLEAN_RENDER_API_KEY=$(echo "$RENDER_API_KEY" | tr -d '\r\n[:space:]')

          if [ -z "$CLEAN_RENDER_API_KEY" ] || [ -z "$CLEAN_RENDER_SERVICE_ID" ]; then
            echo "Error: RENDER_API_KEY or RENDER_SERVICE_ID is not configured in GitHub Secrets (or is empty after stripping whitespace)."
            exit 1
          fi

          # Helper function to trim leading and trailing spaces/tabs/newlines
          trim() {
            echo "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          CLEAN_PYTHON_VERSION=$(trim "$PYTHON_VERSION")
          CLEAN_APP_NAME=$(trim "$APP_NAME")
          CLEAN_DEBUG=$(trim "$DEBUG")
          CLEAN_SECRET_KEY=$(trim "$SECRET_KEY")
          CLEAN_ACCESS_TOKEN_EXPIRE_MINUTES=$(trim "$ACCESS_TOKEN_EXPIRE_MINUTES")
          CLEAN_JWT_ALGORITHM=$(trim "$JWT_ALGORITHM")
          CLEAN_POSTGRES_USER=$(trim "$POSTGRES_USER")
          CLEAN_POSTGRES_PASSWORD=$(trim "$POSTGRES_PASSWORD")
          CLEAN_POSTGRES_HOST=$(trim "$POSTGRES_HOST")
          CLEAN_POSTGRES_PORT=$(trim "$POSTGRES_PORT")
          CLEAN_POSTGRES_DB=$(trim "$POSTGRES_DB")
          CLEAN_ALLOWED_ORIGINS=$(trim "$ALLOWED_ORIGINS")
          CLEAN_MONGO_URI=$(trim "$MONGO_URI")
          CLEAN_MONGO_DATABASE=$(trim "$MONGO_DATABASE")
          CLEAN_AWS_ACCESS_KEY=$(trim "$AWS_ACCESS_KEY")
          CLEAN_AWS_SECRET_KEY=$(trim "$AWS_SECRET_KEY")
          CLEAN_AWS_REGION=$(trim "$AWS_REGION")
          CLEAN_AWS_BUCKET_NAME=$(trim "$AWS_BUCKET_NAME")
          CLEAN_NVIDIA_API_KEY=$(trim "$NVIDIA_API_KEY")
          CLEAN_NVIDIA_BASE_URL=$(trim "$NVIDIA_BASE_URL")
          CLEAN_NVIDIA_MODEL=$(trim "$NVIDIA_MODEL")

          # Construct the JSON payload with environment variables using jq
          # This automatically handles escaping of special characters and maintains clean YAML indentation
          JSON_PAYLOAD=$(jq -n \
            --arg python_version "$CLEAN_PYTHON_VERSION" \
            --arg app_name "$CLEAN_APP_NAME" \
            --arg debug "$CLEAN_DEBUG" \
            --arg secret_key "$CLEAN_SECRET_KEY" \
            --arg access_token_expire_minutes "$CLEAN_ACCESS_TOKEN_EXPIRE_MINUTES" \
            --arg jwt_algorithm "$CLEAN_JWT_ALGORITHM" \
            --arg postgres_user "$CLEAN_POSTGRES_USER" \
            --arg postgres_password "$CLEAN_POSTGRES_PASSWORD" \
            --arg postgres_host "$CLEAN_POSTGRES_HOST" \
            --arg postgres_port "$CLEAN_POSTGRES_PORT" \
            --arg postgres_db "$CLEAN_POSTGRES_DB" \
            --arg allowed_origins "$CLEAN_ALLOWED_ORIGINS" \
            --arg mongo_uri "$CLEAN_MONGO_URI" \
            --arg mongo_database "$CLEAN_MONGO_DATABASE" \
            --arg aws_access_key "$CLEAN_AWS_ACCESS_KEY" \
            --arg aws_secret_key "$CLEAN_AWS_SECRET_KEY" \
            --arg aws_region "$CLEAN_AWS_REGION" \
            --arg aws_bucket_name "$CLEAN_AWS_BUCKET_NAME" \
            --arg nvidia_api_key "$CLEAN_NVIDIA_API_KEY" \
            --arg nvidia_base_url "$CLEAN_NVIDIA_BASE_URL" \
            --arg nvidia_model "$CLEAN_NVIDIA_MODEL" \
            '[
              {"key": "PYTHON_VERSION", "value": $python_version},
              {"key": "APP_NAME", "value": $app_name},
              {"key": "DEBUG", "value": $debug},
              {"key": "SECRET_KEY", "value": $secret_key},
              {"key": "ACCESS_TOKEN_EXPIRE_MINUTES", "value": $access_token_expire_minutes},
              {"key": "JWT_ALGORITHM", "value": $jwt_algorithm},
              {"key": "POSTGRES_USER", "value": $postgres_user},
              {"key": "POSTGRES_PASSWORD", "value": $postgres_password},
              {"key": "POSTGRES_HOST", "value": $postgres_host},
              {"key": "POSTGRES_PORT", "value": $postgres_port},
              {"key": "POSTGRES_DB", "value": $postgres_db},
              {"key": "ALLOWED_ORIGINS", "value": $allowed_origins},
              {"key": "MONGO_URI", "value": $mongo_uri},
              {"key": "MONGO_DATABASE", "value": $mongo_database},
              {"key": "AWS_ACCESS_KEY", "value": $aws_access_key},
              {"key": "AWS_SECRET_KEY", "value": $aws_secret_key},
              {"key": "AWS_REGION", "value": $aws_region},
              {"key": "AWS_BUCKET_NAME", "value": $aws_bucket_name},
              {"key": "NVIDIA_API_KEY", "value": $nvidia_api_key},
              {"key": "NVIDIA_BASE_URL", "value": $nvidia_base_url},
              {"key": "NVIDIA_MODEL", "value": $nvidia_model}
            ]')


          echo "Syncing environment variables to Render Web Service..."
          HTTP_CODE_ENV=$(curl -s -o response_env.json -w "%{http_code}" -X PUT "https://api.render.com/v1/services/$CLEAN_RENDER_SERVICE_ID/env-vars" \
            -H "Authorization: Bearer $CLEAN_RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          if [ "$HTTP_CODE_ENV" -lt 200 ] || [ "$HTTP_CODE_ENV" -ge 300 ]; then
            echo "Error: Failed to sync environment variables. HTTP Status: $HTTP_CODE_ENV"
            cat response_env.json
            exit 1
          fi

          echo "Triggering deployment..."
          HTTP_CODE_DEPLOY=$(curl -s -o response_deploy.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/$CLEAN_RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $CLEAN_RENDER_API_KEY" \
            -H "Accept: application/json")

          if [ "$HTTP_CODE_DEPLOY" -lt 200 ] || [ "$HTTP_CODE_DEPLOY" -ge 300 ]; then
            echo "Error: Failed to trigger deployment. HTTP Status: $HTTP_CODE_DEPLOY"
            cat response_deploy.json
            exit 1
          fi

          echo "Render deployment triggered successfully."
